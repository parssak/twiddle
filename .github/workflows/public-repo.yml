name: Public repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository files and history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-public-files.py
          scanner_dir=$(mktemp -d)
          trap 'rm -rf "$scanner_dir"' EXIT
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --log-opts=--all --redact --no-banner .
          "$scanner_dir/gitleaks" dir --redact --no-banner .
